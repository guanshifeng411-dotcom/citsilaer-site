<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CITSILAER Editor</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      body { overflow: auto; }
      .editor-shell { position: relative; z-index: 1; width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 80px; }
      .editor-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 28px; }
      .editor-title { margin: 0; font-size: 1.1rem; font-weight: 300; letter-spacing: 0.2em; }
      .editor-panel { margin-bottom: 18px; padding: 18px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.03); }
      .editor-panel h2 { margin: 0 0 16px; font-size: 0.95rem; font-weight: 400; letter-spacing: 0.14em; }
      .editor-grid { display: grid; gap: 12px; }
      .editor-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .editor-field { display: grid; gap: 8px; }
      .editor-field label { font-size: 0.82rem; color: rgba(244, 244, 241, 0.68); }
      .editor-field input, .editor-field textarea { width: 100%; color: #f4f4f1; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.12); padding: 12px; font: inherit; }
      .editor-field textarea { min-height: 120px; resize: vertical; line-height: 1.7; }
      .editor-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
      .editor-button { appearance: none; border: 1px solid rgba(255, 255, 255, 0.14); background: transparent; color: #f4f4f1; padding: 12px 16px; cursor: pointer; font: inherit; }
      .editor-note { margin-top: 14px; color: rgba(244, 244, 241, 0.62); font-size: 0.9rem; line-height: 1.8; }
      @media (max-width: 720px) { .editor-grid.two { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="background-image"></div>
    <div class="background-mask"></div>
    <main class="editor-shell">
      <div class="editor-head">
        <h1 class="editor-title">CITSILAER EDITOR</h1>
        <a class="social-link" href="./index.html">返回网站</a>
      </div>

      <section class="editor-panel">
        <h2>站点</h2>
        <div class="editor-grid two">
          <div class="editor-field">
            <label for="siteTitle">标题</label>
            <input id="siteTitle" />
          </div>
          <div class="editor-field">
            <label for="aboutLine">关于我</label>
            <input id="aboutLine" />
          </div>
        </div>
      </section>

      <section class="editor-panel">
        <h2>社交账号</h2>
        <div class="editor-grid" id="socialFields"></div>
      </section>

      <section class="editor-panel">
        <h2>文字</h2>
        <div class="editor-grid" id="writingFields"></div>
      </section>

      <div class="editor-actions">
        <button class="editor-button" id="publishButton" type="button">发布到当前浏览器</button>
        <button class="editor-button" id="downloadButton" type="button">下载内容文件</button>
        <button class="editor-button" id="resetButton" type="button">恢复默认内容</button>
      </div>

      <p class="editor-note">
        “发布到当前浏览器” 会让你现在这台设备里的网站立刻更新。<br />
        “下载内容文件” 可以保存一份新的内容文件，之后上传到网站里，就能让所有访问者看到。
      </p>
    </main>

    <script src="./content/site-content.js"></script>
    <script>
      const STORAGE_KEY = "citsilaer-site-content";
      const defaultContent = window.DEFAULT_SITE_CONTENT || {};
      const currentContent = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || defaultContent;

      const siteTitleInput = document.getElementById("siteTitle");
      const aboutLineInput = document.getElementById("aboutLine");
      const socialFields = document.getElementById("socialFields");
      const writingFields = document.getElementById("writingFields");

      siteTitleInput.value = currentContent.siteTitle || "";
      aboutLineInput.value = currentContent.aboutLine || "";

      socialFields.innerHTML = (currentContent.socials || []).map((item, index) => `
        <div class="editor-grid two">
          <div class="editor-field">
            <label>社交名称 ${index + 1}</label>
            <input data-social-label="${index}" value="${item.label.replace(/"/g, "&quot;")}" />
          </div>
          <div class="editor-field">
            <label>链接 ${index + 1}</label>
            <input data-social-url="${index}" value="${item.url.replace(/"/g, "&quot;")}" />
          </div>
        </div>
      `).join("");

      writingFields.innerHTML = (currentContent.writingItems || []).map((item, index) => `
        <div class="editor-panel">
          <div class="editor-field">
            <label>预览句子 ${index + 1}</label>
            <input data-writing-preview="${index}" value="${item.preview.replace(/"/g, "&quot;")}" />
          </div>
          <div class="editor-field">
            <label>完整内容 ${index + 1}</label>
            <textarea data-writing-full="${index}">${item.full}</textarea>
          </div>
        </div>
      `).join("");

      function collectContent() {
        return {
          ...defaultContent,
          siteTitle: siteTitleInput.value.trim() || defaultContent.siteTitle,
          aboutLine: aboutLineInput.value.trim() || defaultContent.aboutLine,
          socials: (currentContent.socials || []).map((item, index) => ({
            label: document.querySelector(`[data-social-label="${index}"]`).value.trim() || item.label,
            url: document.querySelector(`[data-social-url="${index}"]`).value.trim() || item.url
          })),
          writingItems: (currentContent.writingItems || []).map((item, index) => ({
            preview: document.querySelector(`[data-writing-preview="${index}"]`).value.trim() || item.preview,
            full: document.querySelector(`[data-writing-full="${index}"]`).value.trim() || item.full
          }))
        };
      }

      document.getElementById("publishButton").addEventListener("click", () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(collectContent()));
        alert("已经发布到当前浏览器。刷新首页就能看到。");
      });

      document.getElementById("downloadButton").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(collectContent(), null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "site-content.json";
        link.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById("resetButton").addEventListener("click", () => {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      });
    </script>
  </body>
</html>
